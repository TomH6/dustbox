name: Idea
description: A new feature or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What should Dustbox do, and why would it help when making music?
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Where it goes in the interface, how the SP-303 or other gear does it, sketches or links.
